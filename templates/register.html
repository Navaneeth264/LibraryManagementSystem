<!DOCTYPE html>
<html>
<head>
    <title>Library Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <h1>📚 Create Account</h1>

    <p class="subtitle">
        Register to manage the library
    </p>


    {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
    {% endif %}


    <form method="POST"
          id="registerForm">

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>

        </div>


        <div class="form-group">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                required>

        </div>


        <button type="submit"
                class="submit-btn">
            📝 Register
        </button>

    </form>


    <a href="/login"
       class="back-btn">
        ← Already have an account? Login
    </a>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
