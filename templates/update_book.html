```html
<!DOCTYPE html>
<html>
<head>
    <title>Update Book</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="form-container">

        <h1>✏️ Update Book</h1>

        <p class="subtitle">
            Update the book details
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="title">
                    Book Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ book[1] }}"
                    required>

            </div>


            <div class="form-group">

                <label for="author">
                    Author
                </label>

                <input
                    type="text"
                    id="author"
                    name="author"
                    value="{{ book[2] }}"
                    required>

            </div>


            <button type="submit" class="submit-btn">
                💾 Update Book
            </button>

        </form>


        <a href="/" class="back-btn">
            ← Back to Library
        </a>

    </div>

</div>

</body>
</html>
```
