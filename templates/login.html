```html
<!DOCTYPE html>
<html>
<head>
    <title>Library Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <h1>📚 Library Login</h1>

    <p class="subtitle">
        Login to manage the library
    </p>

    {% if error %}
        <div class="login-error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required>
        </div>


        <div class="form-group">
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required>
        </div>


        <button type="submit" class="submit-btn">
            🔐 Login
        </button>

    </form>

</div>

</body>
</html>
```
